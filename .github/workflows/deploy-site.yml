name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # Build (never deploy) on PRs so the Pages actions are actually exercised
  # before a change to them is merged. Without this the only workflow running on
  # pull_request was repo-tests.yml, which uses none of them — so a Dependabot
  # bump of configure-pages / upload-pages-artifact / deploy-pages showed a green
  # check that had told us nothing about it, and would first be tested against
  # the live site on main.
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Least privilege per job: the build needs to read the repo, only the deploy
# needs to write Pages and mint an OIDC token. A pull_request build must never
# hold those.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into Node 24 ahead of the June 2026 forced switch.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    # Pull requests validate the build only — deploying from a PR would publish
    # unreviewed content to the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
