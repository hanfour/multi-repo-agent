name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # Build (never deploy) on PRs so the Pages actions are actually exercised
  # before a change to them is merged. Without this the only workflow running on
  # pull_request was repo-tests.yml, which uses none of them — so a Dependabot
  # bump of configure-pages / upload-pages-artifact / deploy-pages showed a green
  # check that had told us nothing about it, and would first be tested against
  # the live site on main.
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Least privilege per job: the build needs to read the repo, only the deploy
# needs to write Pages and mint an OIDC token. A pull_request build must never
# hold those.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into Node 24 ahead of the June 2026 forced switch.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    # Pull requests validate the build only — deploying from a PR would publish
    # unreviewed content to the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
